 .companion{display:flex;max-height:60px;justify-content:center}
 .companion .penguin{width:60px;height:60px}
 .stock-content{gap:16px}.stock-header{margin-bottom:4px}
 .help-dialog .rules li{font-size:15px}.help-dialog .rules{gap:12px}
}
@media(max-width:440px){
 .help-dialog{padding:18px 14px}
 .help-dialog .rules li{font-size:12px;gap:7px}
 .help-dialog .rules li:before{width:23px;height:25px;flex-basis:23px;font-size:13px;border-radius:8px}
 .help-dialog .example-line{font-size:16px;gap:8px;padding:10px 6px}
 .help-dialog .example-line small{font-size:12px}
}
@media(orientation:landscape) and (max-height:500px){
 .sidebar{gap:8px}.companion{display:flex;flex:none;height:54px;max-height:54px}
 .companion .penguin{width:48px;height:54px}
 .help-dialog .rules{gap:7px}.help-dialog .rules li{font-size:14px;line-height:1.3}
 .help-dialog .example-line{font-size:18px}
}

.end-panel{text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px;padding:25px 16px}
.end-panel h2{font-family:'GangwonTitle',sans-serif;font-size:30px;line-height:1.2;font-weight:700}
.end-panel p{font-size:20px;line-height:1.5;word-break:keep-all;margin:0}
.end-panel .btn{width:100%;font-size:18px}
@media(max-width:760px) and (orientation:portrait){.end-panel{gap:12px;padding:14px}.end-panel h2{font-size:25px}.end-panel p{font-size:18px}.end-panel .btn{max-width:240px;min-height:46px;padding:10px 16px}}
@media(orientation:landscape) and (max-height:500px){.end-panel{gap:14px;padding:18px 12px}.end-panel h2{font-size:25px}.end-panel p{font-size:17px}.end-panel .btn{font-size:16px;min-height:44px;padding:9px}}



/* Readable supporting text, with compact-screen limits. */
.eyebrow{font-size:16px}.panel-label{font-size:15px}.stockCount{font-size:14px}
.settings-row{font-size:18px}.switch-group button,.btn.quiet{font-size:16px}
.dialog p{font-size:18px}.help-dialog{width:min(780px,100%)}
.help-dialog .rules li{font-size:19px}.help-dialog .example-line small{font-size:16px}
@media(max-width:760px) and (orientation:portrait){
 .panel-label{font-size:13px}.stockCount{font-size:12px}
 .help-dialog .rules li{font-size:16px}
}
@media(max-width:440px){
 .help-dialog .rules li{font-size:clamp(11px,3.05vw,13px);gap:5px;letter-spacing:-.035em}
 .help-dialog .example-line small{font-size:13px}
 .settings-row{gap:8px}.switch-group button{padding:9px 10px}
}
@media(orientation:landscape) and (max-height:500px){
 .eyebrow{font-size:14px}.help-dialog .rules li{font-size:15px}
 .dialog p{font-size:17px}
}



.home h1 span{text-shadow:0 5px 0 #fff}
button,select,input{font-family:inherit}
.home h1,.wordmark,.dialog h2,.dialog h3{font-family:'GangwonTitle',sans-serif;letter-spacing:-.015em}
.home h1{line-height:1.18}

.home-button-label{white-space:nowrap;word-break:keep-all;line-height:1.25}
@media(max-width:440px){.home-button-label>span{display:block}.home-actions .btn{min-width:0;gap:8px;padding:12px 14px}.home-actions .btn svg{flex-shrink:0}}
@media(orientation:landscape) and (max-height:500px){}



.penguin-message{max-width:155px;padding:15px 12px;border:2px solid #c8e5ef;border-radius:20px;background:#ffffffc9;color:#245a77;font-size:20px;line-height:1.4;text-align:center;word-break:keep-all}
.companion .penguin{transform-origin:50% 100%}
.penguin-hop{animation:penguinJoy .4s ease-out!important}
.penguin-cheer{animation:penguinJoy .4s ease-out 2!important}
@keyframes penguinJoy{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-9px) rotate(-3deg)}70%{transform:translateY(-3px) rotate(2deg)}}
.reduce-motion .penguin-hop,.reduce-motion .penguin-cheer{animation:none!important}
@media(prefers-reduced-motion:reduce){.penguin-hop,.penguin-cheer{animation:none!important}}
@media(max-width:760px) and (orientation:portrait){.penguin-message{max-width:230px;padding:8px 12px;font-size:18px}}
@media(orientation:landscape) and (max-height:500px){.penguin-message{padding:7px 10px;font-size:16px}.help-dialog .example-line{font-size:17px}}
@media(max-width:440px){.help-dialog .example-line{font-size:clamp(12px,3.6vw,15px);gap:6px}.help-dialog .rules li{font-size:clamp(10px,2.95vw,13px)}}

const seeds=[1619,2843,4517,6029,7919,9923];
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function generate(seed,max=4){const random=rng(seed);const board=Array.from({length:21},(_,id)=>{let row=0;while((row+1)*(row+2)/2<=id)row++;return{id,row,col:id-row*(row+1)/2,value:0,removed:false}});const stock=[],proof=[];
while(board.some(c=>!c.removed)){let open=board.filter(c=>exposed(board,c.id));for(let i=open.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[open[i],open[j]]=[open[j],open[i]]}const useStock=open.length===1;const count=useStock?1:(open.length>=3&&random()<.38?Math.min(max,open.length,random()<.4?4:3):2);const chosen=open.slice(0,count);const n=count+(useStock?1:0);let remaining=10;const values=[];for(let i=0;i<n-1;i++){const v=1+Math.floor(random()*(remaining-(n-i-1)));values.push(v);remaining-=v}values.push(remaining);chosen.forEach((c,i)=>{c.value=values[i];c.removed=true});if(useStock)stock.push(values[count]);proof.push({ids:chosen.map(c=>c.id),draw:useStock});}
board.forEach(c=>c.removed=false);while(stock.length<18)stock.push(1+Math.floor(random()*9));return{board,stock,proof,seed,max};}
function create(seed,max=4){const p=generate(seed,max);return{board:p.board,stock:[...p.stock],current:null,selected:[],history:[],max,seed,phase:'playing'}}
function available(s){const a=s.board.filter(c=>exposed(s.board,c.id)).map(c=>({id:c.id,value:c.value}));if(s.current!==null)a.push({id:'stock',value:s.current});return a}
function moves(s){const a=available(s),out=[];function walk(pos,ids,sum){if(sum===10){if(ids.length>=2)out.push(ids);return}if(sum>10||ids.length===s.max)return;for(let i=pos;i<a.length;i++)walk(i+1,[...ids,a[i].id],sum+a[i].value)}walk(0,[],0);return out}
// Fixed, varied introduction boards; all cards still allow 2–4 selections.
const starterSeeds=[3682,8080];
function starter(index){const s=create(starterSeeds[index],2);s.max=4;s.starterIndex=index;if(index===1){s.board[1].value=1;s.board[2].value=1;s.stock=[9,9,9]}else s.stock=[9,9];return s}
// Round 1 finishes with one stock pair; round 2 has three final 1 + 9 pairs.
function draw(s){if(s.phase!=='playing'||!s.stock.length)return false;s.current=s.stock.shift();s.selected=[];return true}

function match(s,ids){if(!Array.isArray(ids)||ids.length<2||ids.length>s.max||new Set(ids).size!==ids.length)return null;const a=available(s);const cards=ids.map(id=>a.find(c=>c.id===id));if(cards.some(c=>!c)||cards.reduce((v,c)=>v+c.value,0)!==10)return null;return cards}
function remove(s,ids){const cards=match(s,ids);if(!cards)return false;ids.forEach(id=>{if(id==='stock')s.current=null;else s.board[id].removed=true});s.selected=[];s.history.push(cards.map(c=>c.value));return true}
function status(s){if(s.board.every(c=>c.removed))return'won';if(moves(s).length)return'playing';return s.stock.length?'draw':'finished'}
return{seeds,generate,create,starter,draw,exposed,available,moves,match,remove,status};})();

let startersDone=0,penguinTimer=null;
try{localStorage.removeItem('ice-ten-best-remaining-v1')}catch{}
function updatePenguin(){const won=state&&state.board.every(c=>c.removed);$('penguinMessage').textContent=won?'모두 깼어요!':'10을 만들자!'}
function celebrate(won=false){const img=document.querySelector('#gameScreen .companion .penguin');clearTimeout(penguinTimer);img.classList.remove('penguin-hop','penguin-cheer');if(reduce||matchMedia('(prefers-reduced-motion: reduce)').matches)return;void img.offsetWidth;img.classList.add(won?'penguin-cheer':'penguin-hop');penguinTimer=setTimeout(()=>img.classList.remove('penguin-hop','penguin-cheer'),won?820:420)}
function storeSettings(){try{localStorage.setItem('ice-ten-settings',JSON.stringify({sound,reduce}))}catch{}}
try{const p=JSON.parse(localStorage.getItem('ice-ten-settings')||'{}');sound=p.sound===true;reduce=p.reduce===true}catch{}
function applyPrefs(){document.body.classList.toggle('reduce-motion',reduce);$('soundBtn').setAttribute('aria-pressed',String(sound));$('soundBtn').setAttribute('aria-label',sound?'소리 끄기':'소리 켜기');$('soundBtn').style.opacity=sound?'1':'.62';storeSettings()}
function playSound(){if(!sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();[523.25,659.25,783.99].forEach((frequency,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+i*.09;o.type='sine';o.frequency.value=frequency;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.23)})}catch{}}
function changeScreen(next){screen=next;['home','game'].forEach(s=>$(s+'Screen').hidden=s!==next);requestAnimationFrame(resizeBoard)}
function frame(v){return`<span class="tenframe" aria-hidden="true">${Array.from({length:10},(_,i)=>`<i class="${i<v?'filled':''}"></i>`).join('')}</span>`}
function card(v,id,{locked=false,selected=false}={}){const b=document.createElement('button');b.type='button';b.className='ice'+(locked?' locked':'')+(selected?' selected':'');b.dataset.id=id;b.innerHTML=`<span class="shine" aria-hidden="true"></span><span class="number">${v}</span>${frame(v)}<span class="number corner-bottom" aria-hidden="true">${v}</span>`;b.setAttribute('aria-label',`${id==='stock'?'새 ':''}${v} 얼음${locked?', 아직 가려져 있어요':''}`);b.setAttribute('aria-pressed',String(selected));if(locked)b.setAttribute('aria-disabled','true');return b}
function resizeBoard(){if(screen!=='game')return;const space=$('boardSpace');const rect=space.getBoundingClientRect();const u=Math.max(20,Math.min(108,(rect.width-10)/6.37,(rect.height-14)/5.05));$('gameScreen').style.setProperty('--u',u+'px');$('board').style.setProperty('--gap',(u*.074)+'px');$('board').classList.toggle('small',u<58);}
new ResizeObserver(resizeBoard).observe($('boardSpace'));
function renderBoard(){const focus=document.activeElement?.dataset?.id;const root=$('board');root.replaceChildren();state.board.forEach(c=>{if(c.removed)return;const exposed=IceCore.exposed(state.board,c.id),b=card(c.value,c.id,{locked:!exposed,selected:state.selected.includes(c.id)});b.style.left=`calc((var(--u) + var(--gap)) * ${c.col+(5-c.row)/2})`;b.style.top=`calc(var(--u) * ${c.row*.69})`;b.style.zIndex=c.row+1;b.addEventListener('click',()=>select(c.id));b.setAttribute('aria-label',`${c.row+1}번째 줄 ${c.col+1}번째, ${c.value} 얼음${!exposed?', 아직 가려져 있어요':''}`);if(state.phase==='finished')b.setAttribute('aria-disabled','true');root.appendChild(b)});updatePenguin();renderStock();if(focus!==undefined){const old=[...document.querySelectorAll('#board .ice,#stockSlot .ice')].find(b=>b.dataset.id===focus);old?.focus({preventScroll:true})}resizeBoard()}
function renderStock(){$('stockPanel').hidden=state.phase==='finished';$('endPanel').hidden=state.phase!=='finished';const slot=$('stockSlot');slot.replaceChildren();$('stockCount').hidden=false;$('stockCount').textContent=`${state.stock.length}개 남음`;$('drawBtn').disabled=state.stock.length===0||state.phase!=='playing';$('drawBtn').textContent=state.stock.length?'새 얼음':'모두 열었어요';if(state.current!==null){const b=card(state.current,'stock',{selected:state.selected.includes('stock')});b.onclick=()=>select('stock');slot.append(b)}else{slot.innerHTML=`<div class="stock-empty">${icon('snow')}<span>새 얼음 자리</span></div>`}}
function nextRandomSeed(){let seed;do{seed=globalThis.crypto?.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]:Math.floor(Math.random()*4294967296)}while(seed===lastRandomSeed);lastRandomSeed=seed;return seed}
function startGame(){clearTimeout(timer);clearTimeout(penguinTimer);document.querySelector('#gameScreen .companion .penguin').classList.remove('penguin-hop','penguin-cheer');successText='';state=startersDone<2?IceCore.starter(startersDone):IceCore.create(nextRandomSeed(),4);closeModal();changeScreen('game');renderBoard();$('homeBtn').focus({preventScroll:true})}
function select(id){if(screen!=='game'||!state||state.phase!=='playing'||!$('modal').hidden)return;if(id!=='stock'&&!IceCore.exposed(state.board,id))return;if(id==='stock'&&state.current===null)return;successText='';const i=state.selected.indexOf(id);if(i>=0)state.selected.splice(i,1);else if(state.selected.length>=mode)return;else state.selected.push(id);renderBoard();const match=IceCore.match(state,state.selected);if(match)resolveMatch(match);}

function resolveMatch(cards){state.phase='resolving';const ids=[...state.selected],values=cards.map(c=>c.value);successText=values.join(' + ')+' = 10';$('announcement').textContent=successText+'!';playSound();ids.forEach(id=>document.querySelector(`${id==='stock'?'#stockSlot':'#board'} [data-id="${id}"]`)?.classList.add('breaking'));$('drawBtn').disabled=true;timer=setTimeout(()=>{IceCore.remove(state,ids);state.phase='playing';renderBoard();celebrate(state.board.every(c=>c.removed));const next=IceCore.available(state).find(c=>c.id!=='stock');if(next)document.querySelector(`#board [data-id="${next.id}"]`)?.focus({preventScroll:true});else $('drawBtn').focus({preventScroll:true});const outcome=IceCore.status(state);if(outcome==='won'||outcome==='finished'){state.phase='finished';showResult(outcome==='won')}},reduce||matchMedia('(prefers-reduced-motion: reduce)').matches?100:460)}
function drawNow(){if(!state||!IceCore.draw(state))return;successText='';closeModal();renderBoard();const s=IceCore.status(state);if(s==='finished'){state.phase='finished';showResult(false)}}
function showModal(kind,title,body,cls=''){modalReturn=document.activeElement;modalKind=kind;$('dialog').className='dialog '+cls;$('dialog').innerHTML=`<div class="dialog-header"><h2 id="dialogTitle">${title}</h2><button class="icon-btn" id="closeDialog" aria-label="닫기">${icon('close')}</button></div>${body}`;$('modal').hidden=false;document.querySelectorAll('.screen').forEach(s=>s.inert=true);$('closeDialog').onclick=()=>{const result=modalKind==='result';closeModal();if(result){changeScreen('home');$('startBtn').focus({preventScroll:true})}};$('dialog').focus({preventScroll:true});}
function closeModal(){if($('modal').hidden)return;$('modal').hidden=true;document.querySelectorAll('.screen').forEach(s=>s.inert=false);modalReturn?.focus?.({preventScroll:true});modalKind=''}
function help(){showModal('help','이렇게 놀아요',`<ol class="rules"><li><span><strong>모서리가 모두 드러난 얼음</strong>만 고를 수 있어요.</span></li><li><span>얼음 <strong>두 개부터 네 개까지</strong>, 합이 <strong>10</strong>이면 깨져요.</span></li><li><span>앞의 얼음 두 개를 깨면 뒤의 얼음이 드러나요.</span></li><li><span><strong>새 얼음</strong>도 눌러서 함께 사용할 수 있어요.</span></li><li><span>고른 얼음을 다시 누르면 선택이 풀려요.</span></li></ol><div class="example-line"><span>3 + 7 = 10</span><small>또는</small><span>1 + 2 + 3 + 4 = 10</span></div><div class="dialog-actions"><button id="helpDone" class="btn blue">알겠어요!</button></div>`);$('dialog').classList.add('help-dialog');$('helpDone').onclick=closeModal}

function showResult(){const remaining=state.board.filter(c=>!c.removed).length;if(state.starterIndex!==undefined&&!state.progressSaved){startersDone=Math.max(startersDone,state.starterIndex+1);state.progressSaved=true;}updatePenguin();$('endMessage').textContent=remaining===0?'얼음을 모두 깼어요!':`얼음 ${remaining}개를 남겼어요!`;$('stockPanel').hidden=true;$('endPanel').hidden=false;$('drawBtn').disabled=true;document.querySelectorAll('#board .ice').forEach(b=>b.setAttribute('aria-disabled','true'));$('endTitle').focus({preventScroll:true});}

function settings(){showModal('settings','설정',`<div class="settings-row"><span>움직임 줄이기</span><button id="motionSetting" class="btn quiet">${reduce?'켜짐':'꺼짐'}</button></div><div class="dialog-actions"><button id="settingsDone" class="btn blue">적용하기</button></div>`);let nextReduce=reduce;$('motionSetting').onclick=()=>{nextReduce=!nextReduce;$('motionSetting').textContent=nextReduce?'켜짐':'꺼짐'};$('settingsDone').onclick=()=>{reduce=nextReduce;applyPrefs();if(reduce){clearTimeout(penguinTimer);document.querySelector('#gameScreen .companion .penguin').classList.remove('penguin-hop','penguin-cheer')}closeModal()};}
$('retry').onclick=()=>startGame();$('startBtn').onclick=()=>startGame();$('homeHelp').onclick=help;$('gameHelp').onclick=help;$('drawBtn').onclick=drawNow;$('soundBtn').onclick=()=>{sound=!sound;applyPrefs();if(sound)playSound()};$('settingsBtn').onclick=()=>{if(state.phase!=='resolving')settings()};$('homeBtn').onclick=()=>{if(state.phase==='resolving')return;showModal('confirm','첫 화면으로 갈까요?',`<p>지금 하던 게임은 종료돼요.</p><div class="dialog-actions"><button id="keepPlaying" class="btn secondary">계속 할래요.</button><button id="goHome" class="btn blue">첫 화면</button></div>`);$('keepPlaying').onclick=closeModal;$('goHome').onclick=()=>{closeModal();clearTimeout(timer);changeScreen('home');$('startBtn').focus({preventScroll:true})}};
document.addEventListener('keydown',e=>{if($('modal').hidden)return;if(e.key==='Escape'){$('closeDialog').click();return}if(e.key==='Tab'){const controls=[...$('dialog').querySelectorAll('button:not(:disabled),[tabindex="0"]')];const first=controls[0],last=controls.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('dialog'))){e.preventDefault();last?.focus()}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===$('dialog'))){e.preventDefault();first?.focus()}}});
applyPrefs();
// Optional browser agent access uses exactly the same game state and actions.
const mc=document.modelContext;if(mc?.registerTool){const lifecycle=new AbortController();const tools=[{name:'read_ice_game',title:'얼음 놀이 상태 보기',description:'현재 화면과 고를 수 있는 얼음, 진행 상태를 읽습니다.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({screen,phase:state?.phase??null,available:state?IceCore.available(state):[],selected:state?.selected??[],stockRemaining:state?.stock.length??0})},{name:'select_ice',title:'얼음 하나 고르기',description:'게임 화면에서 얼음 하나를 선택하거나 해제합니다. 합이 10이면 자동으로 깨집니다.',inputSchema:{type:'object',properties:{id:{anyOf:[{type:'integer',minimum:0,maximum:20},{type:'string',enum:['stock']}]}},required:['id'],additionalProperties:false},annotations:{readOnlyHint:false},execute:async input=>{if(screen!=='game'||state?.phase!=='playing'||!$('modal').hidden)throw Error('현재 얼음을 고를 수 없습니다.');if(!input||Object.keys(input).some(k=>k!=='id')||!IceCore.available(state).some(c=>c.id===input.id))throw Error('고를 수 있는 얼음 ID가 아닙니다.');select(input.id);if(state.phase==='resolving')await new Promise(r=>setTimeout(r,510));return{selected:[...state.selected],phase:state.phase,removed:state.board.filter(c=>c.removed).length}}}];tools.forEach(t=>{try{Promise.resolve(mc.registerTool(t,{signal:lifecycle.signal})).catch(()=>{})}catch{}});addEventListener('pagehide',()=>lifecycle.abort(),{once:true})}
})();
</script>
</body></html>
